[project]
name = "operator-kernel"
dynamic = ["version"]
description = "Start supervised Copilot CLI sessions and let them hand off to their next session"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
operator = "operator_cli.entry:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["operator_kernel", "operator_cli"]

[tool.setuptools.dynamic]
version = { attr = "operator_kernel.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is on the path so `operator_cli` imports as a package.
# Its directory is not listed flat: its modules use `from . import ...`, and a
# flat entry would make a second copy of any module that shares a stem.
pythonpath = ["operator_kernel", "tests", "."]
norecursedirs = ["tests/pending"]
